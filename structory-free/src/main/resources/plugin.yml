main: me.mrbast.structory.Structory
version: '${project.version}'
name: Structory
author: MrBast
description: Simple structures plugin
api-version: 1.13
folia-supported: true

commands:
  structory:
    description: Main Structory command
    permission: structory.cmd.use

permissions:
  structory.cmd.use:
    description: Allows /structory
    default: op
  structory.cmd.help:
    description: Allows /structory help
    default: op
  structory.cmd.reload:
    description: Allows /structory reload
    default: op
  structory.cmd.performance:
    description: Allows /structory performance runtime diagnostics
    default: op

  structory.cmd.item.use:
    description: Allows /structory item
    default: op
  structory.cmd.item.help:
    description: Allows /structory item help
    default: op
  structory.cmd.item.save:
    description: Allows /structory item save <name>
    default: op
  structory.cmd.item.delete:
    description: Allows /structory item delete <name>
    default: op
  structory.cmd.item.get:
    description: Allows /structory item get <name>
    default: op
  structory.cmd.item.replace:
    description: Allows /structory item replace <name>
    default: op
  structory.cmd.item.*:
    description: All saved-item commands
    default: op
    children:
      structory.cmd.item.use: true
      structory.cmd.item.help: true
      structory.cmd.item.save: true
      structory.cmd.item.get: true
      structory.cmd.item.delete: true
      structory.cmd.item.replace: true

  structory.cmd.*:
    description: All Structory commands
    default: op
    children:
      structory.cmd.use: true
      structory.cmd.help: true
      structory.cmd.reload: true
      structory.cmd.performance: true
      structory.cmd.item.*: true

  structory.*:
    description: All Structory permissions
    default: op
    children:
      structory.cmd.*: true

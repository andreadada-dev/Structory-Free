name: Structory Free CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: free-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DADACONFIG_REF: a484e764a4ce285c5bbc2ad27e358bc37104421c
  DADAPLATFORM_REF: a70fad0760aeb68e22b45d2e6fa30f291c9d2066
  DADAGUI_REF: 1b1944ec05240cdd4db3212695944636428ac3a2

jobs:
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    runs-on: [self-hosted, linux, x64, coolify]

    steps:
      - name: Checkout Structory Free
        uses: actions/checkout@v4

      - name: Enforce Folia scheduler abstraction
        run: python3 scripts/check-folia-scheduler.py structory-core/src/main/java structory-free/src/main/java

      - name: Checkout DadaConfig
        uses: actions/checkout@v4
        with:
          repository: andreadada/DadaConfig
          ref: ${{ env.DADACONFIG_REF }}
          path: deps/DadaConfig

      - name: Checkout DadaPlatform
        uses: actions/checkout@v4
        with:
          repository: andreadada/DadaPlatform
          ref: ${{ env.DADAPLATFORM_REF }}
          path: deps/DadaPlatform

      - name: Checkout DadaGUIRework
        uses: actions/checkout@v4
        with:
          repository: andreadada/DadaGUIRework
          ref: ${{ env.DADAGUI_REF }}
          path: deps/DadaGUIRework

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Normalize DadaConfig CI dependency
        run: sed -i 's#<artifactId>spigot</artifactId>#<artifactId>spigot-api</artifactId>#' deps/DadaConfig/pom.xml

      - name: Install DadaConfig
        run: mvn -B -f deps/DadaConfig/pom.xml -DskipTests install

      - name: Install DadaPlatform
        run: mvn -B -f deps/DadaPlatform/pom.xml install

      - name: Install DadaGUIRework
        run: mvn -B -f deps/DadaGUIRework/pom.xml -DskipTests install

      - name: Verify Structory Free
        shell: bash
        run: |
          set -o pipefail
          mvn -B clean verify 2>&1 | tee "maven-${{ matrix.java }}.log"

      - name: Upload Maven log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-maven-${{ matrix.java }}
          path: maven-${{ matrix.java }}.log
          if-no-files-found: ignore

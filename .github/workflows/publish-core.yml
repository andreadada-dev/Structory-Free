name: Publish Structory Core

on:
  workflow_dispatch:
  push:
    tags: ["core-v*"]

permissions:
  contents: read
  packages: write

env:
  DADACONFIG_REF: a484e764a4ce285c5bbc2ad27e358bc37104421c
  DADAPLATFORM_REF: a70fad0760aeb68e22b45d2e6fa30f291c9d2066

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reject mutable release coordinates
        run: python3 scripts/check-release-dependencies.py pom.xml structory-core/pom.xml

      - name: Checkout DadaConfig
        uses: actions/checkout@v4
        with:
          repository: andreadada/DadaConfig
          ref: ${{ env.DADACONFIG_REF }}
          path: deps/DadaConfig

      - name: Checkout DadaPlatform
        uses: actions/checkout@v4
        with:
          repository: andreadada/DadaPlatform
          ref: ${{ env.DADAPLATFORM_REF }}
          path: deps/DadaPlatform

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          cache: maven

      - name: Normalize DadaConfig CI dependency
        run: sed -i 's#<artifactId>spigot</artifactId>#<artifactId>spigot-api</artifactId>#' deps/DadaConfig/pom.xml

      - name: Install core build dependencies
        run: |
          mvn -B -f deps/DadaConfig/pom.xml -DskipTests install
          mvn -B -f deps/DadaPlatform/pom.xml -DskipTests install

      - name: Publish parent and shared core
        run: mvn -B -pl structory-core -am -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
